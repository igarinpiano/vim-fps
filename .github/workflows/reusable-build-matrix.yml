# Builds the release binaries of the CLI (BIN_PACKAGE / BIN in
# .github/release.env) for every target and uploads them as artifacts
# (bin-<target>). Shared by publish-all.yml and build-check.yml; add or change
# targets here only.
#
# - Native runners build macOS and Windows directly.
# - Linux, Android and the BSDs use cross (cross-rs): its images bring the C
#   toolchain for each target (for crates that compile C, such as *-sys
#   crates) plus an old glibc. Native ubuntu-latest builds would require a new
#   glibc ("Check glibc floor"). `cross: true` is the tagged cross release,
#   whose images link against old glibc versions; `cross: git` is cross from
#   its main branch, used only for targets the release cannot build
#   (LoongArch, NetBSD, current Android NDKs) — its images are much newer
#   (glibc 2.39), so it must not be used for the rest.
# - `features:` (optional, per target) is added to the cargo/cross command
#   line, e.g. `features: --no-default-features --features foo` for a target
#   where a default feature cannot build or makes no sense (static musl,
#   Android, BSDs, small boards).
# - Every target is required, and the first build that fails stops the rest
#   (fail-fast): nothing is published unless every target was built. The
#   `complete` job at the end checks that each target left its binary and
#   names the ones that did not. To ship without a target, take it out of
#   the matrix.
name: build-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # ── main platforms ───────────────────────────────────────
          # (`features: ""` here only declares the field, so that the
          # matrix stays valid while no target sets one.)
          # (Both Apple targets build on the Intel runner: GitHub's arm64
          # macOS runners are short of capacity. The arm64 binary is
          # cross-compiled there and cannot run, so it skips the smoke test.)
          - { target: aarch64-apple-darwin, os: macos-26-intel, features: "", nosmoke: true }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          # ── more Windows / macOS flavors ─────────────────────────
          - { target: i686-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-gnu, os: windows-latest }
          - { target: universal-apple-darwin, os: macos-26-intel, universal: true }
          # ── more Linux ───────────────────────────────────────────
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: loongarch64-unknown-linux-gnu, os: ubuntu-latest, cross: git }
          # ── Android (Termux) and BSDs ────────────────────────────
          - { target: aarch64-linux-android, os: ubuntu-latest, cross: git }
          - { target: armv7-linux-androideabi, os: ubuntu-latest, cross: git }
          - { target: x86_64-linux-android, os: ubuntu-latest, cross: git }
          - { target: i686-linux-android, os: ubuntu-latest, cross: git }
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-netbsd, os: ubuntu-latest, cross: git }
          - { target: x86_64-unknown-illumos, os: ubuntu-latest, cross: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # (The matrix reaches the scripts through the environment, never pasted
    # into them.)
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Load release settings
        # (tr: a Windows checkout may have turned the file's line ends to CRLF.)
        run: grep -E '^[A-Z_]+=' .github/release.env | tr -d '\r' >> "$GITHUB_ENV"
      # rustup itself (on every runner) rather than an action that wraps it:
      # one third-party action fewer.
      - name: Install Rust (stable)
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }},wasm32-unknown-unknown
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$RUST_TARGETS"
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build the web client (wasm)
        run: bash scripts/build-wasm.sh
      - name: Install cross (release)
        if: matrix.cross == true
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross
      - name: Install cross (git)
        if: matrix.cross == 'git'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked --force
      - name: Build (release, native)
        if: ${{ !matrix.cross && !matrix.universal }}
        # ($FEATURES is several words on purpose.)
        run: cargo build --release --locked -p "$BIN_PACKAGE" --target "$TARGET" $FEATURES
      - name: Build (release, cross)
        if: matrix.cross
        run: cross build --release --locked -p "$BIN_PACKAGE" --target "$TARGET" $FEATURES
      - name: Build (release, macOS universal)
        if: matrix.universal
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p "$BIN_PACKAGE" --target "$t" $FEATURES
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output "target/universal-apple-darwin/release/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "target/universal-apple-darwin/release/$BIN"
      - name: Check glibc floor
        # Required glibc builds must run on RHEL 8 / Debian 10 (glibc 2.28).
        if: contains(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          bin="target/$TARGET/release/$BIN"
          need="$(readelf -V --wide "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "max GLIBC required by $TARGET: ${need:-none}"
          if [ -n "$MAX_GLIBC" ] && [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::$TARGET requires GLIBC_$need (> $MAX_GLIBC)"
            exit 1
          fi
      - name: Smoke test
        if: ${{ !matrix.cross && !matrix.nosmoke }}
        run: |
          exe="$BIN"; [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          "target/$TARGET/release/$exe" --version
      - name: Collect
        run: |
          mkdir -p "out/$TARGET"
          exe="$BIN"; [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          cp "target/$TARGET/release/$exe" "out/$TARGET/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/

  # Every target of the matrix above, or none. A failed build already fails
  # the run; this also catches a build that succeeded without leaving its
  # binary, and lists what is missing after a fail-fast stop.
  complete:
    name: every target built
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # (The matrix of the workflow that is running, not that of the ref it
      # builds: this file as it is here.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/reusable-build-matrix.yml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Compare what was built with the matrix
        run: |
          wanted="$(grep -oE '\{ target: [A-Za-z0-9_-]+' .github/workflows/reusable-build-matrix.yml | awk '{print $3}' | sort -u)"
          built="$(ls binaries 2> /dev/null | sort -u)"
          missing="$(comm -23 <(echo "$wanted") <(echo "$built"))"
          echo "built $(echo "$built" | grep -c .) of $(echo "$wanted" | grep -c .) targets"
          [ -z "$missing" ] && exit 0
          for t in $missing; do echo "::error::not built: $t"; done
          echo "::error::Nothing is published with a target missing. Fix the build, or take the target out of the matrix."
          exit 1
