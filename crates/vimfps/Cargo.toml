[package]
name = "vimfps"
description = "vim-fps: host a multiplayer match of the keyboard-only, Vim-keyed FPS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vimfps-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
self-replace = "1"
qrcode = { version = "0.14", default-features = false }
