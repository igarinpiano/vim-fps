[workspace]
resolver = "3"
members = ["crates/vimfps-core", "crates/vimfps-wasm", "crates/vimfps"]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/igarinpiano/vim-fps"
authors = ["igarinpiano"]

[workspace.dependencies]
vimfps-core = { path = "crates/vimfps-core", version = "1.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
